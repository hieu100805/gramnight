<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="$GN — Gram Night. The People's Coin on TON. GN = GRAM." />
    <meta property="og:title" content="$GN — Gram Night" />
    <meta property="og:description" content="Not Good Night. Gram Night. The People's Coin on TON." />
    <meta property="og:image" content="" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>$GN - GRAM NIGHT</title>
    <script type="module" crossorigin src="./scripts.js"></script>
    <link rel="stylesheet" crossorigin href="./styles.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- GRAM NIGHT Widget -->
<button id="gn-fab" onclick="gnToggle()" title="GRAM NIGHT">🌙</button>

<div id="gn-panel" aria-hidden="true">
  <div id="gn-panel-header">
    <div id="gn-panel-title"><span>🌙</span><span>GRAM NIGHT</span></div>
    <button onclick="gnToggle()" id="gn-close-btn">✕</button>
  </div>
  <iframe
    id="gn-iframe"
    src="./gn-app/index.html"
    title="GRAM NIGHT App"
    allow="clipboard-write"
  ></iframe>
</div>

<style>
  #gn-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 9998;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    cursor: pointer; font-size: 26px;
    background: linear-gradient(135deg, #2b6dff, #33b1ff);
    box-shadow: 0 6px 20px rgba(32,118,255,0.45);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
  }
  #gn-fab:hover { transform: scale(1.1); }

  #gn-panel {
    position: fixed; bottom: 92px; right: 24px; z-index: 9999;
    width: 390px; height: 600px;
    max-height: calc(100vh - 120px);
    border-radius: 24px; overflow: hidden;
    display: flex; flex-direction: column;
    background: #071224;
    border: 1px solid rgba(153,204,255,0.18);
    box-shadow: 0 24px 60px rgba(1,8,20,0.6);
    opacity: 0; pointer-events: none;
    transform: translateY(12px) scale(0.97);
    transform-origin: bottom right;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  #gn-panel.gn-open {
    opacity: 1; pointer-events: auto;
    transform: translateY(0) scale(1);
  }
  #gn-panel-header {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(7,18,36,0.95);
    border-bottom: 1px solid rgba(153,204,255,0.12);
    flex-shrink: 0;
  }
  #gn-panel-title {
    display: flex; align-items: center; gap: 8px;
    color: #ecf5ff; font-weight: 700; font-size: 14px;
    font-family: system-ui, sans-serif;
  }
  #gn-close-btn {
    background: rgba(255,255,255,0.07); border: none;
    color: #9fb9d9; cursor: pointer;
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 13px; display: flex;
    align-items: center; justify-content: center;
  }
  #gn-close-btn:hover { background: rgba(255,255,255,0.14); color: #ecf5ff; }
  #gn-iframe { flex: 1; width: 100%; border: none; background: #071224; }

  @media (max-width: 480px) {
    #gn-panel {
      bottom: 0; right: 0; left: 0; width: 100%;
      height: 90vh; border-radius: 20px 20px 0 0;
    }
  }
</style>

<script>
  (function() {
    var isOpen = false;
    var panel = document.getElementById("gn-panel");
    window.gnToggle = function() {
      isOpen = !isOpen;
      panel.classList.toggle("gn-open", isOpen);
      panel.setAttribute("aria-hidden", String(!isOpen));
    };
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape" && isOpen) window.gnToggle();
    });
  })();
</script>
  </body>
</html>
